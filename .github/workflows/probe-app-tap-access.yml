name: probe-app-tap-access
on: pull_request
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token scoped to homebrew-tap
        id: tap-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.NIRMATA_INTERNAL_APP_ID }}
          private-key: ${{ secrets.NIRMATA_INTERNAL_PRIVATE_KEY }}
          owner: nirmata
          repositories: homebrew-tap
      - name: Deep probe (never prints the token)
        env:
          T: ${{ steps.tap-token.outputs.token }}
        run: |
          echo "── per-repo grant as the installation reports it ──"
          curl -s -H "Authorization: token $T" https://api.github.com/installation/repositories | jq -r '.repositories[] | "\(.full_name) private=\(.private) permissions=\(.permissions)"'
          echo "── REAL write test: create an orphan git blob (harmless, GC-collected, never referenced) ──"
          CODE=$(curl -s -o /tmp/blob.json -w '%{http_code}' -X POST -H "Authorization: token $T" -H "Content-Type: application/json" -d '{"content":"ottoflow release-token probe","encoding":"utf-8"}' https://api.github.com/repos/nirmata/homebrew-tap/git/blobs)
          echo "HTTP $CODE"
          cat /tmp/blob.json | jq -r '.message // "blob created (write WORKS)"'
