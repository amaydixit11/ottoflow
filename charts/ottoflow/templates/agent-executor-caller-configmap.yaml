{{- if and .Values.agentExecutor.enabled .Values.rbac.create }}
# ConfigMap used by agent-executor RBAC auth: SubjectAccessReview checks "get" on this resource
# in the caller namespace. SAs bound to the agent-executor-caller ClusterRole are allowed to call the agent executor.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-executor-caller
  namespace: {{ .Values.agentExecutor.callerNamespace | default (include "ottoflow.namespace" .) }}
  labels:
    {{- include "ottoflow.labels.n4" . }}
    app.kubernetes.io/component: agent-executor-caller
data:
  # Placeholder; the agent executor only checks RBAC (get this ConfigMap), not the contents.
  allowed: "true"
{{- end }}
