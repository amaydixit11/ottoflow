{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ottoflow.fullname" . }}-rolebinding
  labels:
    {{- include "ottoflow.labels.n4" . }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ottoflow.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ if .Values.controller.serviceAccount.name }}{{ .Values.controller.serviceAccount.name }}{{ else }}controller-manager{{ end }}
    namespace: {{ include "ottoflow.namespace" . }}
{{- end }}
