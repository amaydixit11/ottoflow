{{- if and .Values.controller.mcp .Values.controller.mcp.enabled .Values.rbac.create }}
# ConfigMap the MCP server's SubjectAccessReview checks "get" on. Its contents
# are never read; the permission is the whole signal, so that "may this caller
# invoke workflows" is answered by RBAC an operator already knows how to audit
# rather than by an allowlist inside the binary.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-caller
  namespace: {{ include "ottoflow.namespace" . }}
  labels:
    {{- include "ottoflow.labels.n4" . }}
    app.kubernetes.io/component: mcp-caller
data:
  allowed: "true"
{{- end }}
