{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "ottoflow.fullname" . }}-validating
  labels:
    {{- include "ottoflow.labels.n4" . }}
  {{- with .Values.webhook.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
webhooks:
  - name: workflows.ottoflow.nirmata.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "ottoflow.fullname" . }}-webhook
        namespace: {{ include "ottoflow.namespace" . }}
        path: /validate-ottoflow-nirmata-io-v1alpha1-workflow
        port: 443
      # Controller patches caBundle at startup from internal cert manager
      caBundle: {{ .Values.webhook.caBundle | default "" | quote }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["ottoflow.nirmata.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["workflows"]
    sideEffects: None
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  - name: workflowruns.ottoflow.nirmata.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "ottoflow.fullname" . }}-webhook
        namespace: {{ include "ottoflow.namespace" . }}
        path: /validate-ottoflow-nirmata-io-v1alpha1-workflowrun
        port: 443
      caBundle: {{ .Values.webhook.caBundle | default "" | quote }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["ottoflow.nirmata.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["workflowruns"]
    sideEffects: None
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  - name: agents.ottoflow.nirmata.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "ottoflow.fullname" . }}-webhook
        namespace: {{ include "ottoflow.namespace" . }}
        path: /validate-ottoflow-nirmata-io-v1alpha1-agent
        port: 443
      caBundle: {{ .Values.webhook.caBundle | default "" | quote }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["ottoflow.nirmata.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agents"]
    sideEffects: None
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  - name: mcpservers.ottoflow.nirmata.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "ottoflow.fullname" . }}-webhook
        namespace: {{ include "ottoflow.namespace" . }}
        path: /validate-ottoflow-nirmata-io-v1alpha1-mcpserver
        port: 443
      caBundle: {{ .Values.webhook.caBundle | default "" | quote }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["ottoflow.nirmata.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["mcpservers"]
    sideEffects: None
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
{{- end }}
