apiVersion: v1
kind: Secret
metadata:
  name: mcp-auth-secret
  namespace: ottoflow
type: Opaque
stringData:
  token: "your-api-token-here"

---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: MCPServer
metadata:
  name: authenticated-mcp-server
  namespace: ottoflow
spec:
  transport:
    type: http
    address: "https://api.example.com/mcp"
    headers:
      Content-Type: "application/json"
      X-API-Version: "v1"
  timeout: "60s"
  auth:
    type: bearer
    secretRef:
      name: mcp-auth-secret
      namespace: ottoflow
      key: token
  env:
    - name: API_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"

---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Workflow
metadata:
  name: mcp-with-auth-workflow
  namespace: ottoflow
spec:
  inputs:
    - name: tool-name
      description: "MCP tool to call"
      default: "get-resource"
  steps:
    - name: callAuthenticatedTool
      message: "Call MCP tool with authentication"
      mcpToolCall:
        server: authenticated-mcp-server
        tool: 'inputs["tool-name"]'
        arguments:
          resourceType: '"Pod"'
          namespace: '"ottoflow"'
      outputs:
        - name: result
          expression: 'toolResult'
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: WorkflowRun
metadata:
  name: mcp-with-auth-workflow-run-001
  namespace: ottoflow
spec:
  workflowRef:
    name: mcp-with-auth-workflow
  inputValues:
    tool-name: "get-resource"
