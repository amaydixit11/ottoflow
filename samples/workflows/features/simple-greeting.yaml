apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Workflow
metadata:
  name: simple-greeting
  namespace: ottoflow
spec:
  inputs:
    - name: greeting
      description: "A friendly message"
      default: "Hello"
    - name: name
      description: "The user name"
      required: true
  steps:
    - name: greet
      message: "Greet the user"
      outputs:
        - name: greeting
          expression: inputs.greeting + " " + inputs.name
  outputs:
    - name: final-greeting
      expression: variables.greeting
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: WorkflowRun
metadata:
  name: simple-greeting-run-001
  namespace: ottoflow
spec:
  workflowRef:
    name: simple-greeting
  inputValues:
    greeting: "Hello"
    name: "Otto"
