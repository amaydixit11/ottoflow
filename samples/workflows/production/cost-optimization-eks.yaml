# Cost & Resource Optimization Advisor (read-only)
# Collects resource specs + live metrics, fetches real-time AWS pricing via MCP,
# analyzes right-sizing and waste, generates an LLM-powered executive report,
# and optionally notifies Slack.
#
# Prerequisites:
#   - Secret "aws-credentials" with keys: access-key-id, secret-access-key
#   - AWS IAM permissions: pricing:* (free API, no cost incurred)
#
# Run:
#   ottoflow run cost-optimization-eks --workflow-dir samples
#   ottoflow run cost-optimization-eks --workflow-dir samples \
#     --input awsRegion=us-west-2 \
#     --input slackWebhookUrl=https://hooks.slack.com/services/XXX
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Workflow
metadata:
  name: cost-optimization-eks
  namespace: ottoflow
  annotations:
    description: "Read-only cost advisor: collect resource specs and metrics, fetch real-time AWS pricing via MCP, analyze right-sizing and waste, report projected savings, and notify Slack"
spec:
  inputs:
    - name: namespace
      description: "Target namespace (leave empty for all namespaces)"
    - name: awsRegion
      description: "AWS region for pricing lookups (used if nodes lack topology.kubernetes.io/region label)"
      default: "us-east-1"
    - name: cpuCostPerCore
      description: "Fallback monthly cost per vCPU core in USD if MCP pricing is unavailable"
      default: "31.0"
    - name: memoryCostPerGB
      description: "Fallback monthly cost per GB of RAM in USD if MCP pricing is unavailable"
      default: "3.5"
    - name: slackWebhookUrl
      description: "Slack incoming webhook URL for notifications (leave empty to skip)"
    - name: overProvisionThreshold
      description: "Utilization ratio below which a workload is considered overprovisioned (0.0-1.0)"
      default: "0.3"

  steps:
    # ──────────────────────────────────────────────────────────────
    # Step 1: Collect Kubernetes resource specs
    # ──────────────────────────────────────────────────────────────
    - name: collectResources
      message: "Collect pods, deployments, statefulsets, daemonsets, nodes, HPAs, and PVCs"
      expressions:
        - name: targetNs
          expression: 'has(inputs.namespace) && inputs.namespace != "" ? inputs.namespace : ""'
        - name: namespaces
          expression: 'dyn(resource.List("v1", "Namespace", "", {})).items'
        - name: namespaceNames
          expression: >-
            expressions.targetNs != ""
              ? [expressions.targetNs]
              : expressions.namespaces.map(ns, ns.metadata.name)
        - name: pods
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("v1", "Pod", nsName, {})).items).flatten()
              : []
        - name: allPods
          expression: 'dyn(resource.List("v1", "Pod", "", {})).items'
        - name: deployments
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("apps/v1", "Deployment", nsName, {})).items).flatten()
              : []
        - name: statefulsets
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("apps/v1", "StatefulSet", nsName, {})).items).flatten()
              : []
        - name: daemonsets
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("apps/v1", "DaemonSet", nsName, {})).items).flatten()
              : []
        - name: nodes
          expression: 'dyn(resource.List("v1", "Node", "", {})).items'
        - name: hpas
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("autoscaling/v2", "HorizontalPodAutoscaler", nsName, {})).items).flatten()
              : []
        - name: pvcs
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("v1", "PersistentVolumeClaim", nsName, {})).items).flatten()
              : []
      outputs:
        - name: namespaceNames
          expression: 'expressions.namespaceNames'
        - name: pods
          expression: 'expressions.pods'
        - name: allPods
          expression: 'expressions.allPods'
        - name: deployments
          expression: 'expressions.deployments'
        - name: statefulsets
          expression: 'expressions.statefulsets'
        - name: daemonsets
          expression: 'expressions.daemonsets'
        - name: nodes
          expression: 'expressions.nodes'
        - name: hpas
          expression: 'expressions.hpas'
        - name: pvcs
          expression: 'expressions.pvcs'

    # ──────────────────────────────────────────────────────────────
    # Step 1b: Extract EC2 instance types and region from nodes
    # ──────────────────────────────────────────────────────────────
    - name: extractNodeInfo
      message: "Extract EC2 instance types and AWS region from cluster node labels"
      dependsOn:
        - collectResources
      expressions:
        - name: instanceTypes
          expression: >-
            variables.nodes
              .filter(n, has(n.metadata.labels) && "node.kubernetes.io/instance-type" in n.metadata.labels)
              .map(n, n.metadata.labels["node.kubernetes.io/instance-type"])
              .distinct()
        - name: nodeRegions
          expression: >-
            variables.nodes
              .filter(n, has(n.metadata.labels) && "topology.kubernetes.io/region" in n.metadata.labels)
              .map(n, n.metadata.labels["topology.kubernetes.io/region"])
              .distinct()
      outputs:
        - name: instanceTypes
          expression: 'expressions.instanceTypes'
        - name: nodeRegion
          expression: 'size(expressions.nodeRegions) > 0 ? expressions.nodeRegions[0] : inputs.awsRegion'

    # ──────────────────────────────────────────────────────────────
    # Step 1c: Fetch real-time EC2 pricing from AWS Price List API
    # ──────────────────────────────────────────────────────────────
    - name: fetchEC2Pricing
      message: "Fetch on-demand EC2 pricing for the cluster's node instance types"
      dependsOn:
        - extractNodeInfo
      mcpToolCall:
        server: aws-pricing-mcp
        tool: get_pricing
        arguments:
          service_code: '"AmazonEC2"'
          region: 'variables.nodeRegion'
          filters: >-
            [{"Field": "tenancy", "Value": "Shared", "Type": "TERM_MATCH"},
             {"Field": "operatingSystem", "Value": "Linux", "Type": "TERM_MATCH"},
             {"Field": "preInstalledSw", "Value": "NA", "Type": "TERM_MATCH"},
             {"Field": "capacitystatus", "Value": "Used", "Type": "TERM_MATCH"}]
          output_options: '{"pricing_terms": ["OnDemand"], "product_attributes": ["instanceType", "vcpu", "memory", "location"]}'
      outputs:
        - name: ec2PricingData
          expression: 'toolResult'

    # ──────────────────────────────────────────────────────────────
    # Step 1d: Fetch real-time EKS pricing from AWS Price List API
    # ──────────────────────────────────────────────────────────────
    - name: fetchEKSPricing
      message: "Fetch EKS cluster and control-plane pricing"
      dependsOn:
        - extractNodeInfo
      mcpToolCall:
        server: aws-pricing-mcp
        tool: get_pricing
        arguments:
          service_code: '"AmazonEKS"'
          region: 'variables.nodeRegion'
      outputs:
        - name: eksPricingData
          expression: 'toolResult'

    # ──────────────────────────────────────────────────────────────
    # Step 2a: Build list of running pods for metrics collection
    # ──────────────────────────────────────────────────────────────
    - name: buildPodList
      message: "Build list of running pods for metrics collection"
      dependsOn:
        - collectResources
      expressions:
        - name: runningPods
          expression: >-
            variables.pods
              .filter(p, has(p.spec.containers) && has(p.status) && has(p.status.phase) && p.status.phase == "Running")
              .map(p, {"namespace": p.metadata.namespace, "name": p.metadata.name})
      outputs:
        - name: podIdentifiers
          expression: 'expressions.runningPods'

    # ──────────────────────────────────────────────────────────────
    # Step 2b: Collect live CPU/memory metrics for every running pod
    # ──────────────────────────────────────────────────────────────
    - name: collectMetrics
      message: "Collect live CPU and memory metrics for each pod"
      dependsOn:
        - buildPodList
      forEach:
        items: 'variables.podIdentifiers'
        itemVariable: "podItem"
        stepTemplateRef:
          name: get-pod-metrics
          namespace: ottoflow
          arguments:
            namespace: 'variables.podItem.namespace'
            podName: 'variables.podItem.name'
        maxConcurrency: 10
        itemFailurePolicy: Continue
      outputs:
        - name: metricsCollected
          expression: 'size(steps.collectMetrics.succeeded)'
        - name: metricsFailed
          expression: 'size(steps.collectMetrics.failed)'

    # ──────────────────────────────────────────────────────────────
    # Step 3: Analyze right-sizing opportunities
    # ──────────────────────────────────────────────────────────────
    - name: analyzeRightSizing
      message: "Compare actual usage vs requested resources to find overprovisioned workloads"
      dependsOn:
        - collectResources
        - collectMetrics
      expressions:
        # Build a list of per-pod resource comparisons from the forEach results
        - name: podMetricsResults
          expression: >-
            steps.collectMetrics.succeeded
              .filter(r, has(r.outputs.totalCPU) && has(r.outputs.totalMemory))
              .map(r, {
                "podId": dyn(r.item.namespace + "/" + r.item.name),
                "actualCPU": dyn(string(r.outputs.totalCPU)),
                "actualMemory": dyn(string(r.outputs.totalMemory))
              })
        # Match metrics back to pod specs for comparison
        - name: podComparisons
          expression: >-
            expressions.podMetricsResults.map(m, {
              "podId": m.podId,
              "actualCPU": m.actualCPU,
              "actualMemory": m.actualMemory,
              "pod": variables.pods.filter(p, p.metadata.namespace + "/" + p.metadata.name == m.podId)[0]
            }).filter(c, has(c.pod) && has(c.pod.spec.containers))
        # Calculate requested and actual values per pod (parse quantity strings once)
        - name: podResourceComparison
          expression: >-
            expressions.podComparisons.map(c, {
              "podId": c.podId,
              "actualCPUMilli": dyn(quantity(string(c.actualCPU)).asApproximateFloat() * 1000.0),
              "actualMemoryBytes": dyn(quantity(string(c.actualMemory)).asApproximateFloat()),
              "requestedCPUMilli": dyn(c.pod.spec.containers.map(cont,
                has(cont.resources) && has(cont.resources.requests) && has(cont.resources.requests.cpu)
                  ? quantity(string(cont.resources.requests.cpu)).asApproximateFloat() * 1000.0
                  : 0.0
              ).sum()),
              "requestedMemoryBytes": dyn(c.pod.spec.containers.map(cont,
                has(cont.resources) && has(cont.resources.requests) && has(cont.resources.requests.memory)
                  ? quantity(string(cont.resources.requests.memory)).asApproximateFloat()
                  : 0.0
              ).sum())
            }).filter(c, c.requestedCPUMilli > 0.0 || c.requestedMemoryBytes > 0.0)
        # Find CPU-overprovisioned pods (usage / request < threshold)
        - name: cpuOverProvisionedPods
          expression: >-
            expressions.podResourceComparison
              .filter(c,
                double(c.requestedCPUMilli) > 0.0 &&
                (double(c.actualCPUMilli) / double(c.requestedCPUMilli)) < double(inputs.overProvisionThreshold)
              )
              .map(c, {
                "podId": c.podId,
                "actualCPUMilli": c.actualCPUMilli,
                "requestedCPUMilli": c.requestedCPUMilli,
                "cpuUtilizationPct": dyn((double(c.actualCPUMilli) / double(c.requestedCPUMilli)) * 100.0),
                "recommendedCPUMilli": dyn(double(c.actualCPUMilli) * 1.3),
                "cpuSavingsMilli": dyn(double(c.requestedCPUMilli) - (double(c.actualCPUMilli) * 1.3)),
                "actualMemoryBytes": c.actualMemoryBytes,
                "requestedMemoryBytes": c.requestedMemoryBytes
              })
        # Find memory-overprovisioned pods
        - name: memoryOverProvisionedPods
          expression: >-
            expressions.podResourceComparison
              .filter(c,
                double(c.requestedMemoryBytes) > 0.0 &&
                (double(c.actualMemoryBytes) / double(c.requestedMemoryBytes)) < double(inputs.overProvisionThreshold)
              )
              .map(c, {
                "podId": c.podId,
                "actualMemoryBytes": c.actualMemoryBytes,
                "requestedMemoryBytes": c.requestedMemoryBytes,
                "memoryUtilizationPct": dyn((double(c.actualMemoryBytes) / double(c.requestedMemoryBytes)) * 100.0),
                "recommendedMemoryBytes": dyn(double(c.actualMemoryBytes) * 1.3),
                "memorySavingsBytes": dyn(double(c.requestedMemoryBytes) - (double(c.actualMemoryBytes) * 1.3))
              })
        # Combine into a single overprovisioned list (union by podId)
        - name: overProvisionedPodIds
          expression: >-
            (expressions.cpuOverProvisionedPods.map(p, p.podId)
              + expressions.memoryOverProvisionedPods.map(p, p.podId)).distinct()
        - name: overProvisionedPods
          expression: >-
            expressions.overProvisionedPodIds.map(podId, {
              "podId": podId,
              "cpu": dyn(expressions.cpuOverProvisionedPods.filter(p, p.podId == podId).map(p, {
                "actualMilli": p.actualCPUMilli,
                "requestedMilli": p.requestedCPUMilli,
                "utilizationPct": p.cpuUtilizationPct,
                "recommendedMilli": p.recommendedCPUMilli,
                "savingsMilli": p.cpuSavingsMilli
              })),
              "memory": dyn(expressions.memoryOverProvisionedPods.filter(p, p.podId == podId).map(p, {
                "actualBytes": p.actualMemoryBytes,
                "requestedBytes": p.requestedMemoryBytes,
                "utilizationPct": p.memoryUtilizationPct,
                "recommendedBytes": p.recommendedMemoryBytes,
                "savingsBytes": p.memorySavingsBytes
              }))
            })
        # Aggregate savings
        - name: totalCPUSavingsMilli
          expression: >-
            expressions.cpuOverProvisionedPods
              .map(p, p.cpuSavingsMilli > 0.0 ? p.cpuSavingsMilli : dyn(0.0))
              .sum()
        - name: totalCPUSavingsCores
          expression: 'double(expressions.totalCPUSavingsMilli) / 1000.0'
        - name: totalMemorySavingsBytes
          expression: >-
            expressions.memoryOverProvisionedPods
              .map(p, p.memorySavingsBytes > 0.0 ? p.memorySavingsBytes : dyn(0.0))
              .sum()
        - name: totalMemorySavingsGB
          expression: 'double(expressions.totalMemorySavingsBytes) / 1073741824.0'
      outputs:
        - name: overProvisionedPods
          expression: 'expressions.overProvisionedPods'
        - name: overProvisionedCount
          expression: 'size(expressions.overProvisionedPods)'
        - name: totalCPUSavingsCores
          expression: 'expressions.totalCPUSavingsCores'
        - name: totalMemorySavingsGB
          expression: 'expressions.totalMemorySavingsGB'
        - name: totalPodsAnalyzed
          expression: 'size(expressions.podResourceComparison)'
        - name: cpuOverProvisionedCount
          expression: 'size(expressions.cpuOverProvisionedPods)'
        - name: memoryOverProvisionedCount
          expression: 'size(expressions.memoryOverProvisionedPods)'

    # ──────────────────────────────────────────────────────────────
    # Step 4: Detect waste sources and anti-patterns
    # ──────────────────────────────────────────────────────────────
    - name: detectWaste
      message: "Identify idle deployments, BestEffort pods, missing limits, stale images, and orphan PVCs"
      dependsOn:
        - collectResources
      expressions:
        # Idle deployments: spec.replicas == 0 or not set
        - name: idleDeployments
          expression: >-
            variables.deployments.filter(d,
              has(d.spec) && has(d.spec.replicas) && d.spec.replicas == 0
            ).map(d, format("%s/%s", d.metadata.namespace, d.metadata.name))
        # Pods without ANY resource requests (BestEffort QoS)
        - name: bestEffortPods
          expression: >-
            variables.pods.filter(p,
              has(p.spec.containers) &&
              !p.spec.containers.exists(c, has(c.resources) && has(c.resources.requests))
            ).map(p, format("%s/%s", p.metadata.namespace, p.metadata.name))
        # Pods without resource limits
        - name: noLimitsPods
          expression: >-
            variables.pods.filter(p,
              has(p.spec.containers) &&
              p.spec.containers.exists(c,
                !has(c.resources) || !has(c.resources.limits) || c.resources.limits == null
              )
            ).map(p, format("%s/%s", p.metadata.namespace, p.metadata.name))
        # Pods using :latest tag
        - name: latestTagPods
          expression: >-
            variables.pods.filter(p,
              has(p.spec.containers) &&
              p.spec.containers.exists(c, has(c.image) && (c.image.endsWith(":latest") || !c.image.contains(":")))
            ).map(p, format("%s/%s", p.metadata.namespace, p.metadata.name))
        # Orphan PVCs: Bound PVCs not mounted by any running pod
        - name: mountedPVCNames
          expression: >-
            variables.pods
              .filter(p, has(p.spec.volumes))
              .map(p, p.spec.volumes
                .filter(v, has(v.persistentVolumeClaim))
                .map(v, p.metadata.namespace + "/" + v.persistentVolumeClaim.claimName)
              ).flatten().distinct()
        - name: orphanPVCs
          expression: >-
            variables.pvcs
              .filter(pvc, has(pvc.status) && has(pvc.status.phase) && pvc.status.phase == "Bound")
              .filter(pvc,
                !expressions.mountedPVCNames.exists(m, m == pvc.metadata.namespace + "/" + pvc.metadata.name)
              )
              .map(pvc, {
                "name": format("%s/%s", pvc.metadata.namespace, pvc.metadata.name),
                "storage": has(pvc.spec.resources) && has(pvc.spec.resources.requests) && has(pvc.spec.resources.requests.storage)
                  ? string(pvc.spec.resources.requests.storage) : "unknown"
              })
        # Deployments without HPA (potential scaling gap)
        - name: hpaTargets
          expression: >-
            variables.hpas.map(h,
              h.metadata.namespace + "/" + h.spec.scaleTargetRef.name
            )
        - name: deploymentsWithoutHPA
          expression: >-
            variables.deployments
              .filter(d,
                has(d.spec.replicas) && d.spec.replicas > 1 &&
                !expressions.hpaTargets.exists(t, t == d.metadata.namespace + "/" + d.metadata.name)
              )
              .map(d, format("%s/%s (replicas: %d)", d.metadata.namespace, d.metadata.name, d.spec.replicas))
      outputs:
        - name: wasteReport
          value:
            idleDeployments: expressions.idleDeployments
            idleDeploymentCount: size(expressions.idleDeployments)
            bestEffortPods: expressions.bestEffortPods
            bestEffortPodCount: size(expressions.bestEffortPods)
            noLimitsPodCount: size(expressions.noLimitsPods)
            latestTagPodCount: size(expressions.latestTagPods)
            latestTagPods: expressions.latestTagPods
            orphanPVCs: expressions.orphanPVCs
            orphanPVCCount: size(expressions.orphanPVCs)
            deploymentsWithoutHPA: expressions.deploymentsWithoutHPA

    # ──────────────────────────────────────────────────────────────
    # Step 5: Analyze cluster-level utilization
    # ──────────────────────────────────────────────────────────────
    - name: analyzeClusterUtilization
      message: "Calculate cluster capacity, allocatable resources, total requests, and utilization percentages"
      dependsOn:
        - collectResources
      expressions:
        - name: totalNodeCPU
          expression: >-
            variables.nodes.filter(n, has(n.status.capacity) && has(n.status.capacity.cpu)).map(n,
              quantity(string(n.status.capacity.cpu)).asApproximateFloat()
            ).sum()
        - name: totalNodeMemoryBytes
          expression: >-
            variables.nodes.filter(n, has(n.status.capacity) && has(n.status.capacity.memory)).map(n,
              quantity(string(n.status.capacity.memory)).asApproximateFloat()
            ).sum()
        - name: allocatableCPU
          expression: >-
            variables.nodes.filter(n, has(n.status.allocatable) && has(n.status.allocatable.cpu)).map(n,
              quantity(string(n.status.allocatable.cpu)).asApproximateFloat()
            ).sum()
        - name: allocatableMemoryBytes
          expression: >-
            variables.nodes.filter(n, has(n.status.allocatable) && has(n.status.allocatable.memory)).map(n,
              quantity(string(n.status.allocatable.memory)).asApproximateFloat()
            ).sum()
        - name: totalCPURequests
          expression: >-
            variables.allPods.filter(p, has(p.spec.containers)).map(p,
              p.spec.containers.map(c,
                has(c.resources) && has(c.resources.requests) && has(c.resources.requests.cpu)
                  ? quantity(string(c.resources.requests.cpu)).asApproximateFloat()
                  : 0.0
              )
            ).flatten().sum()
        - name: totalMemoryRequests
          expression: >-
            variables.allPods.filter(p, has(p.spec.containers)).map(p,
              p.spec.containers.map(c,
                has(c.resources) && has(c.resources.requests) && has(c.resources.requests.memory)
                  ? quantity(string(c.resources.requests.memory)).asApproximateFloat()
                  : 0.0
              )
            ).flatten().sum()
        - name: cpuRequestUtilPct
          expression: >-
            expressions.allocatableCPU > 0.0
              ? (expressions.totalCPURequests / expressions.allocatableCPU) * 100.0
              : 0.0
        - name: memoryRequestUtilPct
          expression: >-
            expressions.allocatableMemoryBytes > 0.0
              ? (expressions.totalMemoryRequests / expressions.allocatableMemoryBytes) * 100.0
              : 0.0
      outputs:
        - name: clusterUtilization
          value:
            totalNodes: size(variables.nodes)
            totalPods: size(variables.allPods)
            namespacePods: size(variables.pods)
            targetNamespace: 'has(inputs.namespace) && inputs.namespace != "" ? inputs.namespace : "(all)"'
            capacity:
              cpu: format("%.2f cores", expressions.totalNodeCPU)
              memory: format("%.2f GB", expressions.totalNodeMemoryBytes / 1073741824.0)
            allocatable:
              cpu: format("%.2f cores", expressions.allocatableCPU)
              memory: format("%.2f GB", expressions.allocatableMemoryBytes / 1073741824.0)
            totalRequests:
              cpu: format("%.2f cores", expressions.totalCPURequests)
              memory: format("%.2f GB", expressions.totalMemoryRequests / 1073741824.0)
            utilization:
              cpuRequestPercent: format("%.1f%%", expressions.cpuRequestUtilPct)
              memoryRequestPercent: format("%.1f%%", expressions.memoryRequestUtilPct)
        - name: allocatableCPUCores
          expression: 'expressions.allocatableCPU'
        - name: allocatableMemoryGB
          expression: 'expressions.allocatableMemoryBytes / 1073741824.0'
        - name: totalCPURequestsCores
          expression: 'expressions.totalCPURequests'
        - name: totalMemoryRequestsGB
          expression: 'expressions.totalMemoryRequests / 1073741824.0'

    # ──────────────────────────────────────────────────────────────
    # Step 6: Compute projected monthly savings
    # ──────────────────────────────────────────────────────────────
    - name: computeSavings
      message: "Calculate projected monthly savings from right-sizing and waste elimination"
      dependsOn:
        - analyzeRightSizing
        - detectWaste
        - analyzeClusterUtilization
        - fetchEC2Pricing
        - fetchEKSPricing
      expressions:
        # Right-sizing savings (CPU + memory)
        - name: cpuSavingsUSD
          expression: 'variables.totalCPUSavingsCores * double(inputs.cpuCostPerCore)'
        - name: memorySavingsUSD
          expression: 'variables.totalMemorySavingsGB * double(inputs.memoryCostPerGB)'
        - name: rightSizingSavingsUSD
          expression: 'expressions.cpuSavingsUSD + expressions.memorySavingsUSD'
        # Idle deployment waste estimate (assumes 0.25 cores avg per idle deployment)
        - name: idleDeploymentWasteUSD
          expression: >-
            double(variables.wasteReport.idleDeploymentCount) * 0.25 * double(inputs.cpuCostPerCore)
        # Total projected savings
        - name: totalMonthlySavingsUSD
          expression: 'expressions.rightSizingSavingsUSD + expressions.idleDeploymentWasteUSD'
        # Build structured summary for the agent
        - name: summaryPart1
          expression: >-
            format('{"cluster":{"nodes":%d,"totalPods":%d,"namespacePods":%d,"targetNamespace":"%s","allocatableCPU":"%.2f cores","allocatableMemory":"%.2f GB","cpuRequestUtil":"%s","memoryRequestUtil":"%s"}',
              int(variables.clusterUtilization.totalNodes),
              int(variables.clusterUtilization.totalPods),
              int(variables.clusterUtilization.namespacePods),
              variables.clusterUtilization.targetNamespace,
              variables.allocatableCPUCores,
              variables.allocatableMemoryGB,
              variables.clusterUtilization.utilization.cpuRequestPercent,
              variables.clusterUtilization.utilization.memoryRequestPercent
            )
        - name: summaryPart2
          expression: >-
            format(',"rightSizing":{"podsAnalyzed":%d,"overProvisionedCount":%d,"cpuOverProvisioned":%d,"memoryOverProvisioned":%d,"cpuSavingsCores":"%.2f","cpuSavingsUSD":"$%.2f","memorySavingsGB":"%.2f","memorySavingsUSD":"$%.2f"}',
              int(variables.totalPodsAnalyzed),
              int(variables.overProvisionedCount),
              int(variables.cpuOverProvisionedCount),
              int(variables.memoryOverProvisionedCount),
              variables.totalCPUSavingsCores,
              expressions.cpuSavingsUSD,
              variables.totalMemorySavingsGB,
              expressions.memorySavingsUSD
            )
        - name: summaryPart3
          expression: >-
            format(',"waste":{"idleDeployments":%d,"bestEffortPods":%d,"noLimitsPods":%d,"latestTagPods":%d,"orphanPVCs":%d,"deploymentsWithoutHPA":%d,"idleWasteUSD":"$%.2f"}',
              int(variables.wasteReport.idleDeploymentCount),
              int(variables.wasteReport.bestEffortPodCount),
              int(variables.wasteReport.noLimitsPodCount),
              int(variables.wasteReport.latestTagPodCount),
              int(variables.wasteReport.orphanPVCCount),
              size(variables.wasteReport.deploymentsWithoutHPA),
              expressions.idleDeploymentWasteUSD
            )
        - name: summaryPart4
          expression: >-
            format(',"savings":{"cpuRightSizingUSD":"$%.2f","memoryRightSizingUSD":"$%.2f","rightSizingTotalUSD":"$%.2f","idleWasteUSD":"$%.2f","totalMonthlySavingsUSD":"$%.2f"}}',
              expressions.cpuSavingsUSD,
              expressions.memorySavingsUSD,
              expressions.rightSizingSavingsUSD,
              expressions.idleDeploymentWasteUSD,
              expressions.totalMonthlySavingsUSD
            )
        - name: assessmentSummary
          expression: 'expressions.summaryPart1 + expressions.summaryPart2 + expressions.summaryPart3 + expressions.summaryPart4'
        # Cap overprovisioned pods to top 20 by CPU savings for the agent prompt
        # (sort descending by picking pods whose savings exceed all but 19 others)
        - name: topOverProvisionedPods
          expression: >-
            variables.overProvisionedPods
              .filter(p,
                size(p.cpu) > 0
                  ? size(variables.overProvisionedPods.filter(other,
                      size(other.cpu) > 0 && other.cpu[0].savingsMilli > p.cpu[0].savingsMilli
                    )) < 20
                  : size(variables.overProvisionedPods.filter(other,
                      size(other.memory) > 0 && size(p.memory) > 0 && other.memory[0].savingsBytes > p.memory[0].savingsBytes
                    )) < 20
              )
      outputs:
        - name: assessmentSummary
          expression: 'expressions.assessmentSummary'
        - name: totalMonthlySavingsUSD
          expression: 'expressions.totalMonthlySavingsUSD'
        - name: rightSizingSavingsUSD
          expression: 'expressions.rightSizingSavingsUSD'
        - name: idleDeploymentWasteUSD
          expression: 'expressions.idleDeploymentWasteUSD'
        - name: topOverProvisionedPods
          expression: 'expressions.topOverProvisionedPods'
        - name: ec2PricingData
          expression: 'variables.ec2PricingData'
        - name: eksPricingData
          expression: 'variables.eksPricingData'
        - name: instanceTypes
          expression: 'variables.instanceTypes'
        - name: nodeRegion
          expression: 'variables.nodeRegion'

    # ──────────────────────────────────────────────────────────────
    # Step 7: Generate executive report via LLM agent
    # ──────────────────────────────────────────────────────────────
    - name: generateReport
      message: "Generate an executive-friendly cost optimization report"
      dependsOn:
        - computeSavings
        - detectWaste
        - analyzeClusterUtilization
        - analyzeRightSizing
      agentRef:
        name: cost-optimization-agent
        additionalPrompts:
          - >-
            format(
              "Produce an executive cost optimization report for this Kubernetes cluster.\n\n" +
              "## Assessment Data\n%s\n\n" +
              "## Overprovisioned Pods (top 20 by savings, %d total)\n%v\n\n" +
              "## Waste Sources\n" +
              "Idle Deployments: %v\n" +
              "Orphan PVCs: %v\n" +
              "Deployments Without HPA: %v\n\n" +
              "## Cluster Utilization\n%v\n",
              variables.assessmentSummary,
              int(variables.overProvisionedCount),
              variables.topOverProvisionedPods,
              variables.wasteReport.idleDeployments,
              variables.wasteReport.orphanPVCs,
              variables.wasteReport.deploymentsWithoutHPA,
              variables.clusterUtilization
            )
            +
            format(
              "\n## Real-Time AWS Pricing (from AWS Price List API)\n" +
              "Region: %s\n" +
              "Node Instance Types: %v\n\n" +
              "### EC2 On-Demand Pricing\n%v\n\n" +
              "### EKS Pricing\n%v\n\n" +
              "Fallback cost assumptions (use only if AWS pricing data above is empty): " +
              "$%s/core/month CPU, $%s/GB/month memory.\n\n",
              variables.nodeRegion,
              variables.instanceTypes,
              variables.ec2PricingData,
              variables.eksPricingData,
              inputs.cpuCostPerCore,
              inputs.memoryCostPerGB
            )
            +
            "IMPORTANT: Use the real-time AWS pricing data above to calculate accurate costs. " +
            "Map each node's instance type to its on-demand hourly rate and derive per-vCPU and per-GB costs. " +
            "If the pricing data includes Reserved Instance or Savings Plan alternatives, highlight potential additional savings.\n\n" +
            "Structure the report with these sections:\n" +
            "1. Executive Summary with total projected monthly savings as the headline\n" +
            "2. AWS Pricing Context (instance types, on-demand rates, region)\n" +
            "3. Right-Sizing Recommendations (prioritized by savings, using real pricing)\n" +
            "4. Waste Cleanup Opportunities\n" +
            "5. Anti-Pattern Alerts (BestEffort pods, missing limits, latest tags)\n" +
            "6. Cluster Utilization Summary\n" +
            "7. Reserved Instance / Savings Plan Opportunities\n" +
            "8. Recommended Next Steps\n\n" +
            "For each recommendation include: priority (Critical/High/Medium/Low), projected savings, and implementation guidance.\n" +
            "NEVER recommend automatically applying changes. Always recommend review first."
      outputs:
        - name: formattedReport
          expression: 'agentResponse'

    # ──────────────────────────────────────────────────────────────
    # Step 8: Notify Slack (skipped if no webhook URL provided)
    # ──────────────────────────────────────────────────────────────
    - name: notifySlack
      message: "Send savings summary to Slack"
      dependsOn:
        - generateReport
        - computeSavings
        - analyzeRightSizing
        - detectWaste
      matchConditions:
        - name: slackConfigured
          expression: 'has(inputs.slackWebhookUrl) && inputs.slackWebhookUrl != ""'
      expressions:
        - name: slackText
          expression: >-
            format(
              '*Cost Optimization Report (with AWS Pricing)*\n\nProjected Monthly Savings: *$%.2f/mo*\n\n' +
              'Right-sizing: $%.2f | Idle cleanup: $%.2f\n' +
              'Overprovisioned pods: %d | Idle deployments: %d | Orphan PVCs: %d\n' +
              'BestEffort pods: %d | Missing limits: %d\n\n' +
              '_Costs based on real-time AWS Price List API data. Full report in WorkflowRun output._',
              variables.totalMonthlySavingsUSD,
              variables.rightSizingSavingsUSD,
              variables.idleDeploymentWasteUSD,
              int(variables.overProvisionedCount),
              int(variables.wasteReport.idleDeploymentCount),
              int(variables.wasteReport.orphanPVCCount),
              int(variables.wasteReport.bestEffortPodCount),
              int(variables.wasteReport.noLimitsPodCount)
            )
        - name: slackResponse
          expression: >-
            http.Post(inputs.slackWebhookUrl, {"text": expressions.slackText}, {"Content-Type": "application/json"})
      outputs:
        # http.Post returns non-2xx as data, not an error — check status explicitly.
        - name: slackNotified
          expression: 'expressions.slackResponse.statusCode >= 200 && expressions.slackResponse.statusCode < 300'

  outputs:
    - name: report
      expression: 'variables.formattedReport'
    - name: assessmentSummary
      expression: 'variables.assessmentSummary'
    - name: totalMonthlySavingsUSD
      expression: 'variables.totalMonthlySavingsUSD'
    - name: wasteReport
      expression: 'variables.wasteReport'
    - name: clusterUtilization
      expression: 'variables.clusterUtilization'
    - name: overProvisionedPods
      expression: 'variables.overProvisionedPods'
    - name: ec2PricingData
      expression: 'variables.ec2PricingData'
    - name: eksPricingData
      expression: 'variables.eksPricingData'
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Agent
metadata:
  name: cost-optimization-agent
  namespace: ottoflow
spec:
  modelProvider: anthropic
  prompt: |
    You are a Kubernetes FinOps advisor specializing in cost optimization and resource efficiency.

    Your role is to analyze cluster resource data together with real-time AWS pricing
    information (EC2 and EKS) and produce an executive cost optimization report.

    You will receive real-time pricing data from the AWS Price List API. Use this data to:
    - Map each node instance type to its actual on-demand hourly rate
    - Derive accurate per-vCPU and per-GB-memory costs from the instance pricing
    - Calculate monthly costs using: hourly_rate * 730 hours/month
    - Identify whether cheaper instance families could satisfy the same workload
    - Highlight Reserved Instance or Savings Plan opportunities when applicable

    Key principles:
    - Lead with the projected monthly savings number as the headline
    - Always base cost calculations on the real AWS pricing data provided
    - Prioritize recommendations by savings impact (highest first)
    - For each recommendation include: priority level, projected savings, and implementation steps
    - Flag anti-patterns that increase cost risk (BestEffort QoS, missing limits, :latest tags)
    - NEVER recommend automatically applying changes; always recommend human review first
    - Use clear section headers and bullet points for readability
    - Include a "Quick Wins" section for changes that are low-risk and high-impact
    - End with concrete next steps the team can take this week
  outputExtraction:
    type: text
---
# AWS credentials for the Pricing API (pricing:* permissions required, free API)
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: ottoflow
type: Opaque
stringData:
  access-key-id: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  secret-access-key: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: MCPServer
metadata:
  name: aws-pricing-mcp
  namespace: ottoflow
spec:
  transport:
    type: stdio
    command:
      # Resolved from the controller PATH. Patch to an absolute path or use a
      # container entrypoint if uvx is not on PATH in your environment.
      - "uvx"
      - "awslabs.aws-pricing-mcp-server@latest"
  timeout: "60s"
  auth:
    type: none
  env:
    - name: FASTMCP_LOG_LEVEL
      value: "ERROR"
    - name: AWS_REGION
      value: "us-east-1"
    - name: AWS_PROFILE
      value: "default"

---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: WorkflowRun
metadata:
  name: cost-optimization-eks-run-001
  namespace: ottoflow
spec:
  workflowRef:
    name: cost-optimization-eks
  inputValues:
    awsRegion: "us-west-2"
    overProvisionThreshold: "0.3"
