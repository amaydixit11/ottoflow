apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Workflow
metadata:
  name: policy-recommendations
  namespace: ottoflow
  annotations:
    description: "Analyzes cluster to recommend Kyverno policies based on workloads, platform, and add-ons"
spec:
  steps:
    # Step 1: Collect cluster data (namespaces, nodes, workloads)
    - name: collectClusterData
      message: "Collect cluster info, namespaces, nodes, and workloads"
      expressions:
        - name: namespaces
          expression: 'dyn(resource.List("v1", "Namespace", "", {})).items'
        - name: namespaceNames
          expression: 'expressions.namespaces.map(ns, ns.metadata.name)'
        - name: nodes
          expression: 'dyn(resource.List("v1", "Node", "", {})).items'
        - name: pods
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("v1", "Pod", nsName, {})).items).flatten()
              : []
        - name: deployments
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("apps/v1", "Deployment", nsName, {})).items).flatten()
              : []
        - name: statefulsets
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("apps/v1", "StatefulSet", nsName, {})).items).flatten()
              : []
        - name: daemonsets
          expression: >-
            expressions.namespaceNames.size() > 0
              ? expressions.namespaceNames.map(nsName, dyn(resource.List("apps/v1", "DaemonSet", nsName, {})).items).flatten()
              : []
      outputs:
        - name: namespaces
          expression: 'expressions.namespaces'
        - name: namespaceNames
          expression: 'expressions.namespaceNames'
        - name: nodes
          expression: 'expressions.nodes'
        - name: pods
          expression: 'expressions.pods'
        - name: deployments
          expression: 'expressions.deployments'

    # Step 2: Collect RBAC and detect wildcards
    - name: collectRBAC
      message: "Collect ClusterRoles and detect wildcard permissions"
      dependsOn:
        - collectClusterData
      expressions:
        - name: clusterRoles
          expression: 'dyn(resource.List("rbac.authorization.k8s.io/v1", "ClusterRole", "", {})).items'
        - name: clusterRoleBindings
          expression: 'dyn(resource.List("rbac.authorization.k8s.io/v1", "ClusterRoleBinding", "", {})).items'
        - name: wildcardClusterRoles
          expression: >-
            expressions.clusterRoles.filter(cr,
              has(cr.rules) && cr.rules.exists(r,
                (has(r.verbs) && r.verbs.exists(v, v == "*")) ||
                (has(r.resources) && r.resources.exists(res, res == "*"))
              )
            )
      outputs:
        - name: clusterRoles
          expression: 'expressions.clusterRoles'
        - name: wildcardClusterRoleCount
          expression: 'size(expressions.wildcardClusterRoles)'

    # Step 3: Compute security metrics from pods
    - name: computeSecurityMetrics
      message: "Compute pod security metrics (privileged, hostNetwork, hostPath, etc.)"
      dependsOn:
        - collectClusterData
      expressions:
        - name: privilegedPods
          expression: >-
            variables.pods.filter(p, has(p.spec) && has(p.spec.containers) && p.spec.containers.exists(cont, has(cont.securityContext) && "privileged" in cont.securityContext && cont.securityContext.privileged == true)).size()
        - name: hostNetworkPods
          expression: 'variables.pods.filter(p, has(p.spec) && "hostNetwork" in p.spec && p.spec.hostNetwork == true).size()'
        - name: hostPathPods
          expression: >-
            variables.pods.filter(p, has(p.spec) && has(p.spec.volumes) && p.spec.volumes.exists(vol, has(vol.hostPath))).size()
        - name: latestTagPods
          expression: >-
            variables.pods.filter(p, has(p.spec) && has(p.spec.containers) && p.spec.containers.exists(cont, has(cont.image) && cont.image.endsWith(":latest"))).size()
        - name: noLimitsPods
          expression: >-
            variables.pods.filter(p, has(p.spec) && has(p.spec.containers) && p.spec.containers.exists(cont, !has(cont.resources) || !("limits" in cont.resources) || cont.resources.limits == null)).size()
        - name: productionNamespaces
          expression: >-
            variables.namespaceNames.filter(ns, ns.contains("prod") || ns.contains("production")).size()
      outputs:
        - name: privilegedPods
          expression: 'expressions.privilegedPods'
        - name: hostNetworkPods
          expression: 'expressions.hostNetworkPods'
        - name: hostPathPods
          expression: 'expressions.hostPathPods'
        - name: latestTagPods
          expression: 'expressions.latestTagPods'
        - name: noLimitsPods
          expression: 'expressions.noLimitsPods'
        - name: productionNamespaces
          expression: 'expressions.productionNamespaces'

    # Step 4: Collect Kyverno policies (skipped when Kyverno not installed)
    - name: collectPolicies
      message: "Collect Kyverno policy counts"
      dependsOn:
        - detectAddons
        - collectClusterData
      matchConditions:
        - name: kyvernoInstalled
          expression: 'variables.crdNames.exists(c, c.contains("clusterpolicies") && c.contains("kyverno"))'
      expressions:
        - name: clusterPolicies
          expression: 'dyn(resource.List("kyverno.io/v1", "ClusterPolicy", "", {})).items'
        - name: policies
          expression: >-
            variables.namespaceNames.size() > 0
              ? variables.namespaceNames.map(ns, dyn(resource.List("kyverno.io/v1", "Policy", ns, {})).items).flatten()
              : []
        - name: verifyImagesCount
          expression: >-
            expressions.clusterPolicies.filter(cp, has(cp.spec) && has(cp.spec.rules) && cp.spec.rules.exists(r, has(r.verifyImages))).size()
      outputs:
        - name: clusterPolicyCount
          expression: 'size(expressions.clusterPolicies)'
        - name: policyCount
          expression: 'size(expressions.policies)'
        - name: verifyImagesCount
          expression: 'expressions.verifyImagesCount'

    # Step 5: Detect platform from node providerIDs
    - name: detectPlatform
      message: "Detect cluster platform (EKS, GKE, AKS, OpenShift, vanilla)"
      dependsOn:
        - collectClusterData
      expressions:
        - name: providerIDs
          expression: 'variables.nodes.map(n, n.?spec.providerID.orValue("")).filter(id, id != "")'
        - name: hasOpenshift
          expression: 'variables.namespaceNames.exists(n, n.startsWith("openshift"))'
        - name: platformType
          expression: >-
            expressions.hasOpenshift ? "openshift"
            : expressions.providerIDs.exists(id, id.contains("aws")) ? "eks"
            : expressions.providerIDs.exists(id, id.contains("gce")) ? "gke"
            : expressions.providerIDs.exists(id, id.contains("azure")) ? "aks"
            : "vanilla"
      outputs:
        - name: platformType
          expression: 'expressions.platformType'

    # Step 6: Detect add-ons by namespace + CRD presence
    - name: detectAddons
      message: "Detect installed add-ons (Istio, Flux, cert-manager, etc.)"
      dependsOn:
        - collectClusterData
      expressions:
        - name: crds
          expression: 'dyn(resource.List("apiextensions.k8s.io/v1", "CustomResourceDefinition", "", {})).items'
        - name: crdNames
          expression: 'expressions.crds.map(c, c.metadata.name)'
        - name: addons
          expression: >-
            [
              variables.namespaceNames.exists(n, n == "istio-system") && expressions.crdNames.exists(c, c.contains("istio.io")) ? "istio" : "",
              variables.namespaceNames.exists(n, n == "linkerd") && expressions.crdNames.exists(c, c.contains("linkerd.io")) ? "linkerd" : "",
              variables.namespaceNames.exists(n, n == "flux-system") && expressions.crdNames.exists(c, c.contains("fluxcd.io")) ? "flux" : "",
              variables.namespaceNames.exists(n, n == "argocd") && expressions.crdNames.exists(c, c.contains("argoproj.io")) ? "argocd" : "",
              variables.namespaceNames.exists(n, n == "tekton-pipelines") && expressions.crdNames.exists(c, c.contains("tekton.dev")) ? "tekton" : "",
              variables.namespaceNames.exists(n, n == "crossplane-system") && (expressions.crdNames.exists(c, c.contains("crossplane.io")) || expressions.crdNames.exists(c, c.contains("upbound.io"))) ? "crossplane" : "",
              variables.namespaceNames.exists(n, n == "karpenter") && expressions.crdNames.exists(c, c.contains("karpenter")) ? "karpenter" : "",
              variables.namespaceNames.exists(n, n == "kubevirt") && expressions.crdNames.exists(c, c.contains("kubevirt.io")) ? "kubevirt" : "",
              variables.namespaceNames.exists(n, n == "kasten-io") && expressions.crdNames.exists(c, c.contains("kasten.io")) ? "kasten" : "",
              variables.namespaceNames.exists(n, n == "cert-manager") && expressions.crdNames.exists(c, c.contains("cert-manager.io")) ? "cert-manager" : "",
              expressions.crdNames.exists(c, c.contains("monitoring.coreos.com")) ? "prometheus" : ""
            ].filter(a, a != "")
      outputs:
        - name: detectedAddons
          expression: 'expressions.addons'
        - name: crdNames
          expression: 'expressions.crdNames'

    # Step 7: Identify unknown (user) namespaces
    - name: computeUnknownNamespaces
      message: "Identify namespaces that may need custom policies"
      dependsOn:
        - collectClusterData
        - detectAddons
      expressions:
        - name: knownPrefixes
          expression: >-
            ["kube-", "local-path", "kyverno", "istio", "linkerd", "flux", "argocd", "tekton", "crossplane", "karpenter", "kubevirt", "kasten", "cert-manager", "monitoring", "nginx", "nirmata", "prometheus"]
        - name: unknownNamespaces
          expression: >-
            variables.namespaceNames.filter(ns,
              !expressions.knownPrefixes.exists(prefix, ns.startsWith(prefix) || ns == prefix.replace("-", ""))
              && ns != "default"
            )
      outputs:
        - name: unknownNamespaces
          expression: 'expressions.unknownNamespaces'

    # Step 8: Ensure policy count defaults (when collectPolicies skipped due to Kyverno not installed)
    - name: ensurePolicyVars
      message: "Set default policy counts when Kyverno not installed"
      dependsOn:
        - collectPolicies
      expressions:
        - name: cpolCount
          expression: 'int(variables.?clusterPolicyCount.orValue(0))'
        - name: polCount
          expression: 'int(variables.?policyCount.orValue(0))'
        - name: verifyCount
          expression: 'int(variables.?verifyImagesCount.orValue(0))'
      outputs:
        - name: clusterPolicyCount
          expression: 'string(expressions.cpolCount)'
        - name: policyCount
          expression: 'string(expressions.polCount)'
        - name: verifyImagesCount
          expression: 'string(expressions.verifyCount)'

    # Step 9: Compute policy recommendations
    - name: computeRecommendations
      message: "Compute policy recommendations based on assessment"
      dependsOn:
        - collectRBAC
        - computeSecurityMetrics
        - ensurePolicyVars
        - detectPlatform
        - detectAddons
        - computeUnknownNamespaces
        - collectClusterData
        - collectPolicies
      expressions:
        - name: baselineRecs
          expression: >-
            ( (int(variables.clusterPolicyCount) == 0 && int(variables.policyCount) == 0) || int(variables.privilegedPods) > 0 || int(variables.hostNetworkPods) > 0
              ? [{"policy": "pod-security-baseline", "priority": int(variables.clusterPolicyCount) == 0 ? "CRITICAL" : "HIGH", "reason": format("Pod security gaps: %d privileged, %d hostNetwork, %d hostPath", int(variables.privilegedPods), int(variables.hostNetworkPods), int(variables.hostPathPods)), "indicators": format("privileged=%d,hostnetwork=%d,hostpath=%d", int(variables.privilegedPods), int(variables.hostNetworkPods), int(variables.hostPathPods))}]
              : [] )
            + ( int(variables.wildcardClusterRoleCount) > 0
              ? [{"policy": "rbac-best-practices", "priority": "HIGH", "reason": format("Wildcard RBAC detected: %d ClusterRoles", int(variables.wildcardClusterRoleCount)), "indicators": format("wildcard_roles=%d", int(variables.wildcardClusterRoleCount))}]
              : [] )
            + ( int(variables.noLimitsPods) > 10 || int(variables.latestTagPods) > 5
              ? [{"policy": "kubernetes-best-practices", "priority": "MEDIUM", "reason": format("Resource management gaps: %d without limits, %d with latest tag", int(variables.noLimitsPods), int(variables.latestTagPods)), "indicators": format("no_limits=%d,latest_tags=%d", int(variables.noLimitsPods), int(variables.latestTagPods))}]
              : [] )
            + ( int(variables.verifyImagesCount) == 0 && int(variables.productionNamespaces) > 0
              ? [{"policy": "image-verification", "priority": "HIGH", "reason": format("No image verification in production (%d prod namespaces)", int(variables.productionNamespaces)), "indicators": format("prod_namespaces=%d", int(variables.productionNamespaces))}]
              : [] )
        - name: platformRec
          expression: >-
            variables.platformType == "eks" ? {"policy": "eks", "priority": "HIGH", "reason": "Amazon EKS detected"}
            : variables.platformType == "openshift" ? {"policy": "openshift", "priority": "CRITICAL", "reason": "Red Hat OpenShift detected"}
            : variables.platformType == "gke" ? {"policy": "gke", "priority": "MEDIUM", "reason": "Google GKE detected"}
            : variables.platformType == "aks" ? {"policy": "aks", "priority": "MEDIUM", "reason": "Microsoft AKS detected"}
            : {"policy": "vanilla", "priority": "INFO", "reason": "Vanilla Kubernetes"}
        - name: addonRecs
          expression: >-
            variables.detectedAddons.map(a, 
              a == "istio" ? {"policy": "istio", "priority": "HIGH", "reason": "Service mesh detected"}
              : a == "linkerd" ? {"policy": "linkerd", "priority": "HIGH", "reason": "Service mesh detected"}
              : a == "flux" ? {"policy": "flux", "priority": "HIGH", "reason": "GitOps detected"}
              : a == "argocd" ? {"policy": "argocd", "priority": "HIGH", "reason": "GitOps detected"}
              : a == "tekton" ? {"policy": "tekton", "priority": "MEDIUM", "reason": "CI/CD detected"}
              : a == "crossplane" ? {"policy": "crossplane", "priority": "MEDIUM", "reason": "Infrastructure orchestration detected"}
              : a == "karpenter" ? {"policy": "karpenter", "priority": "MEDIUM", "reason": "Node provisioning detected"}
              : a == "kubevirt" ? {"policy": "kubevirt", "priority": "MEDIUM", "reason": "Virtualization detected"}
              : a == "kasten" ? {"policy": "kasten", "priority": "MEDIUM", "reason": "Backup detected"}
              : a == "cert-manager" ? {"policy": "cert-manager", "priority": "LOW", "reason": "Certificate management detected"}
              : a == "prometheus" ? {"policy": "prometheus", "priority": "LOW", "reason": "Monitoring detected"}
              : {"policy": string(a), "priority": "LOW", "reason": "Add-on detected"}
            )
        - name: assessmentClusterInfo
          expression: >-
            {
              "namespaceCount": size(variables.namespaceNames),
              "nodeCount": size(variables.nodes),
              "podCount": size(variables.pods),
              "deploymentCount": size(variables.deployments),
              "productionNamespaces": int(variables.productionNamespaces)
            }
        - name: assessmentSecurity
          expression: >-
            {
              "privilegedPods": int(variables.privilegedPods),
              "hostNetworkPods": int(variables.hostNetworkPods),
              "hostPathPods": int(variables.hostPathPods),
              "latestTagPods": int(variables.latestTagPods),
              "noLimitsPods": int(variables.noLimitsPods),
              "wildcardClusterRoles": int(variables.wildcardClusterRoleCount)
            }
        - name: assessmentPolicies
          expression: >-
            {
              "clusterPolicyCount": int(variables.clusterPolicyCount),
              "policyCount": int(variables.policyCount),
              "verifyImagesCount": int(variables.verifyImagesCount)
            }
        - name: assessmentSummaryPart1
          expression: >-
            format('{"clusterInfo":{"namespaceCount":%d,"nodeCount":%d,"podCount":%d,"deploymentCount":%d,"productionNamespaces":%d},"security":{"privilegedPods":%d,"hostNetworkPods":%d,"hostPathPods":%d,"latestTagPods":%d,"noLimitsPods":%d}',
              size(variables.namespaceNames),
              size(variables.nodes),
              size(variables.pods),
              size(variables.deployments),
              int(variables.productionNamespaces),
              int(variables.privilegedPods),
              int(variables.hostNetworkPods),
              int(variables.hostPathPods),
              int(variables.latestTagPods),
              int(variables.noLimitsPods)
            )
        - name: assessmentSummaryPart2
          expression: >-
            format(',"wildcardClusterRoles":%d},"policies":{"clusterPolicyCount":%d,"policyCount":%d,"verifyImagesCount":%d},"platform":"%s"}',
              int(variables.wildcardClusterRoleCount),
              int(variables.clusterPolicyCount),
              int(variables.policyCount),
              int(variables.verifyImagesCount),
              string(variables.platformType)
            )
        - name: assessmentSummary
          expression: 'expressions.assessmentSummaryPart1 + expressions.assessmentSummaryPart2'
      outputs:
        - name: baselineRecommendations
          expression: 'expressions.baselineRecs'
        - name: platformRecommendation
          expression: 'expressions.platformRec'
        - name: addonRecommendations
          expression: 'expressions.addonRecs'
        - name: assessmentClusterInfo
          expression: 'expressions.assessmentClusterInfo'
        - name: assessmentSecurity
          expression: 'expressions.assessmentSecurity'
        - name: assessmentPolicies
          expression: 'expressions.assessmentPolicies'
        - name: assessmentSummary
          expression: 'expressions.assessmentSummary'
        - name: unknownNamespaces
          expression: 'variables.unknownNamespaces'

    # Step 10: Format and present via Agent
    - name: formatRecommendations
      message: "Format recommendations as actionable report"
      dependsOn:
        - computeRecommendations
        - computeUnknownNamespaces
      agentRef:
        name: policy-recommender-agent
        additionalPrompts:
          - >-
            format(
              "Format the following Kyverno policy assessment as a clear, actionable report.\n\n" +
              "## Assessment Summary\n%s\n\n" +
              "## Platform Recommendation\n%v\n\n" +
              "## Baseline Recommendations\n%v\n\n" +
              "## Add-on Recommendations\n%v\n\n" +
              "## Unknown Namespaces (may need custom policies)\n%v\n\n" +
              "For each recommendation provide: Priority, Rationale (security impact), Implementation approach (start in Audit mode, review for 7 days, then Enforce), Source URL.\n" +
              "End with: Would you like to scan your cluster with these policies to preview violations?",
              variables.assessmentSummary,
              variables.platformRecommendation,
              variables.baselineRecommendations,
              variables.addonRecommendations,
              variables.unknownNamespaces
            )
      outputs:
        - name: formattedReport
          expression: 'agentResponse'

  outputs:
    - name: report
      expression: 'variables.formattedReport'
    - name: assessmentSummary
      expression: 'variables.assessmentSummary'
    - name: baselineRecommendations
      expression: 'variables.baselineRecommendations'
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Agent
metadata:
  name: policy-recommender-agent
  namespace: ottoflow
spec:
  modelProvider: anthropic
  prompt: |
    You are a Kubernetes policy governance expert. Your role is to analyze cluster assessment data and present Kyverno policy recommendations clearly and actionable.

    Key principles:
    - NEVER recommend automatically applying or creating policies
    - Provide compelling rationale for each recommendation (security impact, detection basis)
    - Use clear priority levels: Critical, High, Medium, Low
    - For each recommendation include: Impact, Implementation approach (Audit mode first, then Enforce), Source URL when available
    - Offer next actions: scan cluster with recommended policies, generate custom policies, prioritize deployment
  outputExtraction:
    type: text
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: WorkflowRun
metadata:
  name: policy-recommendations-run-001
  namespace: ottoflow
spec:
  workflowRef:
    name: policy-recommendations
  inputValues: {}
